name: Manual GHCR deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character lowercase commit SHA already published to GHCR
        required: true
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy verified GHCR release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'release_sha must be a 40-character lowercase commit SHA.\n' >&2
            exit 2
          fi

      - name: Deploy through pinned SSH host
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          JARVIS_HOST: ${{ secrets.JARVIS_HOST }}
          JARVIS_USER: ${{ secrets.JARVIS_USER }}
          JARVIS_DEPLOY_KEY: ${{ secrets.JARVIS_DEPLOY_KEY }}
          JARVIS_KNOWN_HOSTS: ${{ secrets.JARVIS_KNOWN_HOSTS }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/jarvis_deploy_key"
          known_hosts_file="$RUNNER_TEMP/jarvis_known_hosts"
          printf '%s\n' "$JARVIS_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$JARVIS_KNOWN_HOSTS" > "$known_hosts_file"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -i "$key_file" \
            "$JARVIS_USER@$JARVIS_HOST" \
            /home/tengis/rag-chatbot/scripts/deploy/ssh-release-entrypoint.sh "$RELEASE_SHA"

      - name: Verify public release revision
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          health="$(curl -fsS --max-time 30 https://api.ragchatbot.dev/health)"
          [[ "$health" == *"\"revision\":\"sha-$RELEASE_SHA\""* ]]
          [[ "$health" == *'"draining":false'* ]]
