services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_chatbot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/rag_chatbot}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    command: npx tsx watch src/index.ts

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rag_web
    restart: unless-stopped
    depends_on:
      - api
    # No VITE_API_BASE_URL set → api.ts fallback uses window.location.hostname:4000

    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    command: npx vite

volumes:
  postgres_data:
