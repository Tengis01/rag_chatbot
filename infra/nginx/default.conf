# Only cloudflared (private Docker network) and host loopback can reach this listener.
# Cloudflare overwrites CF-Connecting-IP; ignore user-supplied X-Forwarded-*.
map $http_cf_connecting_ip $client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_zone $client_ip zone=ingestion:10m rate=6r/m;
limit_req_zone $client_ip zone=chat:10m rate=20r/m;

server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 8080;
    server_name ragchatbot.dev;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}

server {
    listen 8080;
    server_name api.ragchatbot.dev;
    server_tokens off;
    client_max_body_size 21m; # 20 MiB file + multipart envelope; API enforces exact file limit.
    client_body_timeout 30s;
    limit_req_status 429;
    error_page 413 = @too_large;
    error_page 429 = @too_many;
    location @too_large { default_type application/json; return 413 '{"error":"PDF file must not exceed 20 MB"}'; }
    location @too_many { default_type application/json; add_header Retry-After 30 always; return 429 '{"error":"Too many requests. Try again shortly."}'; }

    # Docker DNS re-resolves API after container replacement (rollback/deploy).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host api.ragchatbot.dev;
    proxy_set_header X-Forwarded-Host api.ragchatbot.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 105s;
    proxy_send_timeout 105s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/api/auth/(sign-in|sign-up|forget-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass $api;
    }
    location ~ ^/documents/(upload|paste)$ {
        limit_req zone=ingestion burst=2 nodelay;
        proxy_pass $api;
    }
    location = /chat {
        limit_req zone=chat burst=3 nodelay;
        proxy_pass $api;
    }
    location / { proxy_pass $api; }
}
